version: 2
updates:
  # PHP / Composer dependencies (package root). Minor and patch bumps are grouped
  # into a single PR to keep the noise down; majors open on their own.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Chore(deps)"
    groups:
      composer-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Documentation website (Astro / npm)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Chore(deps)"
    groups:
      website-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows. Actions are SHA-pinned; Dependabot rewrites
  # both the SHA and the trailing version comment when a new release lands.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "CI"
    groups:
      github-actions:
        patterns:
          - "*"
